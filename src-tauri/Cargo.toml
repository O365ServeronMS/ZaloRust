[package]
name = "zalors"
version = "2026.11.13"
edition = "2021"
rust-version = "1.82"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Batch 27b M2 / batch 28 M4: the deployed app is a DEBUG build, and the
# archive viewer decodes JPEG XL (jxl-oxide) / JPEG / PNG (image), resizes
# and encodes WebP (libwebp, a bundled C build). Unoptimised those crates
# are an order of magnitude too slow, so they build at opt-level 3 in dev
# profiles, WITHOUT debug assertions and overflow checks (both are on in the
# dev profile and cost another ~2x inside the pixel loops; the crates are
# audited upstream and the app never relies on their panics). libwebp-sys
# is C: its `cc` build reads the profile's opt-level, so without the
# override it is compiled -O0. Everything else stays at the dev defaults.
# (A generic function of these crates that the app instantiates itself, such
# as `image::imageops::resize`, is compiled at the APP's opt-level: the app
# therefore calls only the non-generic entry points, see shadow/img_derive.)
[profile.dev.package.jxl-oxide]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.jxl-oxide-common]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.jxl-bitstream]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.jxl-coding]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.jxl-color]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.jxl-frame]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.jxl-grid]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.jxl-image]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.jxl-jbr]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.jxl-modular]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.jxl-render]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.jxl-threadpool]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.jxl-vardct]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.png]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.miniz_oxide]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.fdeflate]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.crc32fast]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.simd-adler32]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package."brotli-decompressor@5.0.3"]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.image]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.zune-jpeg]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.zune-core]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.webp]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.libwebp-sys]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.bytemuck]
opt-level = 3
debug-assertions = false
overflow-checks = false

[lib]
name = "zalors_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon", "image-png", "unstable", "macos-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }
argon2 = { version = "0.5.3", features = ["std"] }  # Argon2id password hashing for the app lock (PHC strings)
ureq = { version = "3", default-features = false, features = ["rustls", "socks-proxy"] }
semver = "1"
sha2 = "0.10"
# Batch 30 M5: MD5 for the getLoginInfo response key (zca-js
# ParamsEncryptor.createEncryptKey: MD5(zcid_ext)). RustCrypto, the same
# family as sha2/aes/cbc; the ONLY crate batch 30 adds (user-approved).
md-5 = { version = "0.10", default-features = false }
# Batch 27b M2: the archive viewer shows JPEG XL (WebView2 cannot decode it)
# by decoding it with this pure-Rust decoder (batch 28: to WebP
# derivatives, see below). default-features = false
# drops rayon (single-threaded decode, no CMS) -- the only new crate family.
jxl-oxide = { version = "0.12.6", default-features = false }
# Batch 28: lossy WebP derivatives (thumb + view) of the archive images.
# `webp` wraps the bundled libwebp C build (cc); `image` (already in the
# lockfile through tauri) decodes JPEG/PNG and resizes. Nothing else new.
webp = { version = "=0.3.1", default-features = false }
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png"] }

# --- Shadow DB (feat/shadow-db-rebuild) --------------------------------------
# SQLCipher storage for the shadow DB. `bundled-sqlcipher-vendored-openssl`
# builds SQLCipher + OpenSSL from source; that needs perl on PATH at build
# time (strawberry-perl), see the build-env note in the repo docs.
rusqlite = { version = "0.34", features = ["bundled-sqlcipher-vendored-openssl"] }
# WS frames (encrypt=2) use AES-128-GCM with a per-connection key.
aes-gcm = "0.10"
# REST bodies (`zpw_enk`) are AES-128-CBC with a zero IV.
cbc = { version = "0.1", features = ["alloc"] }
aes = "0.8"
# encrypt=1/2 bodies are gzip-wrapped.
flate2 = "1"
base64 = "0.22"
# Random 32-byte DB key, DPAPI-wrapped on disk (Windows).
getrandom = "0.2"
# L4 (batch 4): zeroize key material at the boundaries (loaded DB key
# bytes, the PRAGMA hex form, runtime REST/WS keys). Already in the
# dependency tree via the TLS stack; the lockfile pins 1.9.1.
zeroize = "1"

[target.'cfg(target_os = "linux")'.dependencies]
# Version-matched to wry 0.55's webkit2gtk so PlatformWebview::inner() types unify.
webkit2gtk = "=2.0.2"
# Already in the tree through tauri/wry; named directly to pin the single-window
# recovery bar (GtkBox child packing). Same 0.18 line wry uses.
gtk = "0.18"
zbus = "5"
zbus_polkit = "5.0.0"

[target.'cfg(windows)'.dependencies]
# Version-matched to wry 0.55 for the WebView2 PermissionRequested mic/camera handler.
webview2-com = "0.39"
windows = { version = "0.62", features = [
  "Win32_Foundation",         # existing
  "Win32_System_Com",         # existing (webview2 permission handler)
  "Security_Credentials_UI",  # UserConsentVerifier + result/availability enums
  "Win32_System_WinRT",       # IUserConsentVerifierInterop
  "Foundation",
  "Data_Xml_Dom",
  "UI_Notifications",               # async return-type plumbing
  "Win32_Security",           # SECURITY_ATTRIBUTES (referenced by RegCreateKeyExW)
  "Win32_System_Registry",    # RegCreateKeyExW/RegSetValueExW: register the toast AUMID in HKCU
  "Win32_UI_Shell",           # SetCurrentProcessExplicitAppUserModelID, ShellExecuteW (open links/files)
  "Win32_UI_Controls_Dialogs", # native per-download Save As dialog
  "Win32_UI_WindowsAndMessaging", # SW_SHOWNORMAL for ShellExecuteW
  "Win32_Globalization",      # GetUserDefaultLocaleName: default UI language
  "Win32_Security_Cryptography",  # CryptProtectData/CryptUnprotectData: DPAPI wrap for the shadow DB key (D2)
] }
windows-core = "0.62"
# In windows-rs 0.61 IAsyncOperation moved out of windows::Foundation into the
# windows-future crate (0.2.1 is already in the tree via the windows stack).
windows-future = "0.3"
# WinRT toasts raised directly so their result can be logged (notify.rs). Same
# version the notification plugin already pulls in, so no new crate is vendored.
tauri-winrt-notification = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
# macOS < 14 guard for data_store_identifier (per-account isolation). Already at
# 0.3.2 in Cargo.lock via the dependency graph; the NSProcessInfo feature must be
# explicit. Inert on Linux/Windows. NSString + NSError added for the Touch ID backend.
objc2-foundation = { version = "0.3", features = ["NSProcessInfo", "NSString", "NSError", "NSUserDefaults"] }
# CGRect/CGPoint/CGSize for the synchronous NSWindow frame restore in menubar.rs.
objc2-core-foundation = "0.3.2"
objc2-local-authentication = { version = "0.3.2", features = ["LAContext", "block2"] }
objc2 = "0.6"
# The macOS main queue, used by menubar.rs to order panel transitions after window geometry changes
dispatch2 = "0.3.1"
block2 = "0.6"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"  # native folder/PNG pickers, called from Rust only (no JS permission): custom download folder + app icon
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-window-state = "2"
user-idle = { version = "0.6", default-features = false, features = ["dbus"] }  # system idle time for the idle auto-lock trigger (dbus: no libxss-dev needed)

[target.'cfg(target_os = "linux")'.dev-dependencies]
# Mock runtime for the IPC permission tests (src/ipc_acl_tests.rs, Linux only).
# The feature adds no crates, so Cargo.lock and the offline Flatpak sources are
# unchanged.
tauri = { version = "2", features = ["tray-icon", "image-png", "test"] }
