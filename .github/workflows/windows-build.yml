name: windows-build
on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ['v*']

# Builds the Windows NSIS installer (.exe) and uploads it as a workflow
# artifact. Pushing a tag `vYYYY.M.D` (no leading zeros: semver) also publishes
# a GitHub Release with the installer and SHA256SUMS (the exact name the
# in-app updater reads).
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "~2.12" --locked

      - name: Unit tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: Build installers
        run: cargo tauri build --bundles nsis

      - name: Checksums
        shell: pwsh
        run: |
          $dir = "src-tauri/target/release/bundle"
          Get-ChildItem -Recurse $dir -Include *.exe | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)" | Tee-Object -Append SHA256SUMS
          }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Zalo-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            SHA256SUMS
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $notes = "docs/release-notes/$tag.md"
          if (-not (Test-Path $notes)) { throw "missing $notes" }
          gh release create $tag --title "Zalo $tag" --notes-file $notes --latest `
            (Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe).FullName SHA256SUMS
