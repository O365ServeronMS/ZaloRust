name: flatpak

on:
  workflow_dispatch:

jobs:
  build-flatpak:
    name: Flatpak (x86_64)
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          bundle: Zalo_x86_64.flatpak
          manifest-path: io.github.o365serveronms.zalors.yml
          branch: stable
          cache-key: zalors-flatpak-${{ github.sha }}
          arch: x86_64
          verbose: true
