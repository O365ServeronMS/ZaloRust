<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Zalo — Armazenamento bloqueado</title>
    <script src="vi.js"></script>
    <script src="i18n.js"></script>
    <link rel="stylesheet" href="lock.css" />
    <link rel="stylesheet" href="dialog.css" />
  </head>
  <body>
    <div class="lock-card">
      <div class="lock-glyph" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6 M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg></div>
      <h1>Armazenamento com senha</h1>
      <p class="lock-subtitle">Digite a senha do banco de dados para abrir o histórico capturado.</p>
      <input type="password" id="password" placeholder="Senha do banco de dados" autocomplete="current-password" aria-label="Senha do banco de dados" />
      <label class="remember-line"><input type="checkbox" id="remember" /> Lembrar neste computador</label>
      <button id="unlock">Desbloquear</button>
      <p id="error" class="error" role="alert"></p>
      <button id="skip" class="secondary">Usar sem o histórico</button>
    </div>
    <script src="dialog.js"></script>
    <script src="shadow-unlock.js"></script>
  </body>
</html>
